[project]
name = "db-cli"
version = "0.1"
description = "Command line interface for DesignBuilder file operations."
requires-python = ">=3.10"
authors = [
    { name = "Bartlomiej Tokarzewski", email = "bartlomiej.tokarzewski@gmail.com" },
]
dependencies = [
    "fire",
    "designbuilder_schema @ git+https://github.com/DesignBuilderSoftware/db-schema.git",
    "db-process @ git+https://github.com/DesignBuilderSoftware/db-process.git",
]

readme = "README.md"

[project.urls]
Homepage = "https://github.com/DesignBuilderSoftware/db-cli"
"Bug Tracker" = "https://github.com/DesignBuilderSoftware/db-cli/issues"

[tool.setuptools]
packages = ["db_cli"]

[project.scripts]
db-cli = "db_cli.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.11,<0.13",
    "pylint>=3.0.3",
    "pre-commit>=3.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C90", # mccabe complexity
]
ignore = ["E203"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["db_cli"]

[tool.pylint."messages control"]
disable = [
    "C0301", # line-too-long (enforced by ruff at line-length 96)
    "R0903", # too-few-public-methods (noise on small classes)
]
