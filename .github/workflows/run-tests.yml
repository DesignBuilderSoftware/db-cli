# This workflow will run linting and tests.

name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      # designbuilder_schema is installed from a private repo; authenticate
      # git with a PAT (DB_SCHEMA_TOKEN secret) before resolving dependencies.
      - name: Configure git auth for private dependency
        run: git config --global url."https://x-access-token:${{ secrets.DB_SCHEMA_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run ruff check
        run: uv run ruff check db_cli tests
      - name: Run ruff format check
        run: uv run ruff format --check db_cli tests
      - name: Run pylint
        run: uv run pylint db_cli

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Configure git auth for private dependency
        run: git config --global url."https://x-access-token:${{ secrets.DB_SCHEMA_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest -q
